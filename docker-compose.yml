services:
  exasol:
    image: exasol/docker-db:latest
    container_name: fraudshield-exasol
    privileged: true
    ports:
      - "8563:8563"
    environment:
      INIT_DATABASE: "true"
      EXASOL_ADMIN_PASSWORD: exasol
    volumes:
      - exasol-data:/exa/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8563'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  simulator:
    build: ./app
    container_name: fraudshield-simulator
    command: ["python", "-m", "fraudshield.simulator"]
    environment:
      BACKEND_URL: http://api:8000
      TXN_INTERVAL_SECONDS: "3"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./app
    container_name: fraudshield-api
    command: ["uvicorn", "fraudshield.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      EXASOL_DSN: exasol:8563
      EXASOL_USER: sys
      EXASOL_PASSWORD: exasol
    depends_on:
      exasol:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build: ./app
    container_name: fraudshield-dashboard
    command: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  exasol-data:
